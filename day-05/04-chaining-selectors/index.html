<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Chaining Selectors</title>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <!-- Use the classes BELOW this line -->
    <div>
      <img
        class="avatar proportioned"
        src="./images/surprised-cat.jpg"
        alt="Surprised yellow cat emoji"
      />
      <img
        class="avatar distorted"
        src="./images/sad-rocket.jpg"
        alt="Sad blue rocket emoji"
      />
    </div>
    <!-- Use the classes ABOVE this line -->
    <div>
      <img
        class="original proportioned"
        src="./images/surprised-cat.jpg"
        alt="Surprised yellow cat emoji"
      />
      <img
        class="original distorted"
        src="./images/sad-rocket.jpg"
        alt="Sad blue rocket emoji"
      />
    </div>
  </body>
</html>
