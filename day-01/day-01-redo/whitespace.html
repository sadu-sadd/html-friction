<!-- This is a paragraph with multiple spaces and redundant spaces and tabs -->
<p>This         is 
a paragraph with        multiple spaces
    and redundant spaces and tabs</p>
<!-- The browser will ignore the extra spaces and tabs by parsing the HTML code-->

<!-- The white-space: pre style will preserve the extra spaces and tabs -->
<p style="white-space: pre">This         is 
    a paragraph with        multiple spaces
        and redundant spaces and tabs</p>
