<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Day 07 Display Lab</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <p class="copy">
      This line of text wraps so the paragraph lands on three or four lines.
      Here is <span class="a">span a</span> in the middle of the sentence,
      still inline. Here is <span class="b">span b</span> beside it as
      inline-block. The rest of the sentence finishes the paragraph.
    </p>

    <p class="label">baseline gap before</p>
    <div class="frame">
      <img src="../../day-01/cat.jpeg" alt="Cat" />
    </div>

    <p class="label">baseline gap after</p>
    <div class="frame fixed">
      <img src="../../day-01/cat.jpeg" alt="Cat" />
    </div>
  </body>
</html>
