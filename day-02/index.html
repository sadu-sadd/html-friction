<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Document</title>
        <!-- Heading inside head tag is moved to body tag when seen in Elements pannel-->
        <!-- But in the source code, it is still inside the head tag-->
        <h1>Heading inside head tag</h1>
    </head>
    <body>
        <h1>This is a heading</h1>
        <p>This is a paragraph</p>
        <p>This is another paragraph</p>
        <!-- With UTF-8, this will be displayed in readable characters-->
        <p>café, नमस्ते, こんにちは, 😀</p>
    </body>
</html>
